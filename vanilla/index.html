<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe less</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #05070a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .atmosphere-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #05070a;
            z-index: -1;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50%;
            aspect-ratio: 1;
            background: rgba(49, 46, 129, 0.2);
            filter: blur(120px);
        }

        .blob-2 {
            bottom: -20%;
            right: -10%;
            width: 60%;
            aspect-ratio: 1;
            background: rgba(19, 78, 74, 0.2);
            filter: blur(150px);
        }

        .blob-3 {
            top: 20%;
            right: 10%;
            width: 30%;
            aspect-ratio: 1;
            background: rgba(37, 99, 235, 0.1);
            filter: blur(100px);
        }

        .pacer-core {
            transition: transform 1s ease-in-out, opacity 1s ease-in-out;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .active-view {
            display: block !important;
        }
        
        .timer-val {
            font-variant-numeric: tabular-nums;
        }

        input[type=range] {
            accent-color: #14b8a6;
        }
    </style>
</head>
<body>
    <div class="atmosphere-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="app" class="container mx-auto px-10 py-8 max-w-6xl relative z-10 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="flex justify-between items-center mb-16">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-teal-400 to-blue-500 flex items-center justify-center">
                    <div class="w-4 h-4 bg-white rounded-full opacity-40 animate-pulse"></div>
                </div>
                <h1 class="text-xl font-light tracking-widest uppercase text-slate-100">
                    Breathe <span id="logo-span" class="font-semibold text-teal-400">less</span>
                </h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="toggle-lang" class="flex items-center space-x-2 bg-white/5 border border-white/10 px-3 py-2 rounded-full hover:bg-white/10 transition-all text-[10px] tracking-widest uppercase font-bold text-slate-400">
                    <i data-lucide="languages" class="w-3.5 h-3.5 text-teal-400"></i>
                    <span id="lang-btn-text">中文</span>
                </button>

                <button id="measure-cp-btn" class="flex items-center space-x-2 bg-white/5 border border-white/10 px-4 py-2 rounded-full hover:bg-white/10 transition-all text-xs tracking-widest uppercase font-bold">
                    <i data-lucide="bar-chart-3" class="w-3.5 h-3.5 text-teal-400"></i>
                    <span id="cp-display" class="text-slate-300">Measure CP</span>
                </button>
                <div class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center overflow-hidden bg-white/5">
                    <i data-lucide="activity" class="w-5 h-5 opacity-40"></i>
                </div>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div id="view-container" class="flex-1">
            <!-- Views will be injected here -->
        </div>

        <!-- Footer -->
        <footer class="mt-24 pb-12 text-center">
            <p id="copyright-text" class="text-[10px] font-black text-slate-600 uppercase tracking-[0.5em]">
                © 2026 ButeykoFlow Protocol
            </p>
            <div class="h-px w-8 bg-white/10 mx-auto mt-4"></div>
        </footer>
    </div>

    <!-- Templates -->
    <template id="tpl-dashboard">
        <div class="grid gap-16 fade-in">
            <section>
                <div class="flex items-center justify-between mb-10">
                    <h2 id="training-protocols-title" class="text-xs uppercase tracking-[0.4em] font-black text-teal-400/60">Training Protocols</h2>
                    <div class="h-px w-24 bg-white/10 ml-6"></div>
                </div>
                <div id="session-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Sessions injected here -->
                </div>
            </section>

            <section class="relative p-12 rounded-[40px] bg-gradient-to-br from-white/[0.03] to-transparent border border-white/5 overflow-hidden">
                <div class="relative z-10 flex flex-col md:flex-row items-center gap-12">
                    <div class="flex-1 space-y-6">
                        <h3 id="why-title" class="text-3xl font-light tracking-tight text-white leading-tight">Master the Art of <br/><span class="font-bold text-teal-400">Normal Breathing</span></h3>
                        <p id="why-desc" class="text-slate-400 leading-relaxed text-sm max-w-lg">
                            Buteyko helps synchronize breathing with metabolic needs. High CO2 tolerance is the foundation of peak performance and deep recovery.
                        </p>
                    </div>
                    <div class="flex gap-4 text-center">
                        <div class="px-6 py-4 bg-teal-400/10 rounded-2xl border border-teal-400/20 min-w-[120px]">
                            <p class="text-xl font-bold text-teal-400 tracking-tighter">24s</p>
                            <p id="avg-cp-label" class="text-[10px] uppercase font-bold text-teal-600/60 leading-none mt-1">Average CP</p>
                        </div>
                        <div class="px-6 py-4 bg-blue-400/10 rounded-2xl border border-blue-400/20 min-w-[120px]">
                            <p class="text-xl font-bold text-blue-400 tracking-tighter">12.4k</p>
                            <p id="total-breaths-label" class="text-[10px] uppercase font-bold text-blue-600/60 leading-none mt-1">Total Breaths</p>
                        </div>
                    </div>
                </div>
                <div class="absolute top-0 right-0 w-[500px] h-full bg-teal-500/5 blur-[120px] rounded-full -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
            </section>
        </div>
    </template>

    <template id="tpl-cp-test">
        <div class="flex flex-col items-center py-12 fade-in">
            <div class="bg-white/[0.03] backdrop-blur-xl rounded-[40px] p-6 sm:p-10 border border-white/5 shadow-2xl max-w-md w-full mx-auto relative overflow-hidden flex flex-col min-h-[500px]">
                <div class="flex justify-between items-start mb-6 relative z-10 w-full">
                    <div>
                        <h2 id="diag-label" class="text-xs font-black text-teal-400 uppercase tracking-[0.3em]">Diagnostics</h2>
                        <h3 id="cp-label" class="text-xl sm:text-2xl font-light text-slate-100 mt-1">Control Pause</h3>
                    </div>
                    <div class="flex bg-white/5 rounded-full p-1 border border-white/5">
                        <button id="tab-timer" class="px-3 py-1.5 rounded-full text-[10px] uppercase font-bold tracking-widest transition-colors bg-teal-500 text-[#05070a]">Control Pause</button>
                        <button id="tab-history" class="px-3 py-1.5 rounded-full text-[10px] uppercase font-bold tracking-widest transition-colors text-slate-400 hover:text-slate-200">History</button>
                    </div>
                </div>

                <div id="view-timer" class="flex-1 flex flex-col relative z-10">
                    <div class="flex justify-end mb-4">
                        <button id="cp-info-toggle" class="p-2 text-slate-600 hover:text-teal-400 transition-colors">
                            <i data-lucide="info" class="w-4.5 h-4.5"></i>
                        </button>
                    </div>

                    <div id="cp-info-box" class="hidden overflow-hidden mb-8 bg-teal-500/5 rounded-2xl p-5 text-[10px] text-teal-200/60 leading-loose tracking-wide border border-teal-500/10">
                        <strong id="protocol-label" class="text-teal-400 uppercase font-black tracking-widest block mb-2">Protocol</strong>
                        <ol id="protocol-steps" class="list-decimal list-inside space-y-2"></ol>
                    </div>

                    <div class="flex flex-col items-center flex-1 justify-center py-4">
                        <div id="cp-timer-display" class="text-8xl sm:text-9xl font-thin timer-val text-white tracking-tighter mb-10 drop-shadow-[0_0_30px_rgba(255,255,255,0.1)]">0</div>
                        <div class="flex space-x-6">
                            <button id="cp-start-stop" class="w-20 h-20 rounded-full flex items-center justify-center transition-all duration-500 bg-teal-500 text-[#05070a] shadow-[0_0_50px_rgba(20,184,166,0.3)]">
                                <i data-lucide="play" class="fill-current w-7 h-7 ml-1"></i>
                            </button>
                            <button id="cp-reset" class="w-20 h-20 rounded-full bg-white/5 border border-white/5 text-slate-500 hover:text-slate-300 flex items-center justify-center transition-all">
                                <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>

                    <div id="cp-result-box" class="hidden mt-6 p-5 bg-teal-500/5 border border-teal-500/10 rounded-3xl flex items-center space-x-4">
                        <i data-lucide="check-circle-2" class="text-teal-400 w-6 h-6"></i>
                        <div>
                            <p id="assess-label" class="text-xs font-black text-teal-400 uppercase tracking-widest">Assessment: 0s</p>
                            <p id="assess-desc" class="text-[10px] text-slate-500 mt-1 uppercase tracking-tight">Foundation</p>
                        </div>
                    </div>
                </div>

                <div id="view-history" class="hidden flex-1 flex flex-col relative z-10">
                    <div id="history-empty" class="hidden flex-1 flex flex-col items-center justify-center text-slate-500">
                        <i data-lucide="trending-up" class="w-12 h-12 mb-4 opacity-20"></i>
                        <p class="text-sm font-medium">No records yet.</p>
                    </div>

                    <div id="history-content" class="flex flex-col h-full space-y-8">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2 text-teal-400">
                                <i data-lucide="trending-up" class="w-4 h-4"></i>
                                <span id="highest-cp-label" class="text-[10px] font-black uppercase tracking-widest">Highest CP</span>
                            </div>
                            <span id="highest-cp-val" class="text-2xl font-light text-white">0s</span>
                        </div>

                        <div id="chart-container" class="h-48 w-full bg-white/[0.02] border border-white/5 rounded-3xl p-4 hidden">
                            <canvas id="cp-chart"></canvas>
                        </div>

                        <div class="space-y-3 flex-1 overflow-y-auto pr-2 custom-scrollbar max-h-64">
                            <p id="past-records-label" class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Past Records</p>
                            <div id="records-list" class="space-y-3"></div>
                        </div>
                    </div>
                </div>

                <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-teal-500/5 blur-3xl rounded-full"></div>
            </div>
            <button id="cp-back" class="mt-8 text-slate-500 hover:text-slate-300 underline text-xs tracking-widest uppercase">Return to Sessions</button>
        </div>
    </template>

    <template id="tpl-session">
        <div class="min-h-[85vh] flex flex-col pt-8 pb-12 fade-in">
            <div class="flex gap-8 items-center justify-center mb-6 max-w-2xl mx-auto w-full">
                <button id="session-back" class="flex items-center text-slate-500 hover:text-teal-400 transition-colors group text-xs tracking-widest uppercase font-bold">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2 group-hover:-translate-x-1 transition-transform"></i>
                    <span id="session-back-text">Return to Protocol</span>
                </button>

                <button id="settings-toggle" class="flex items-center space-x-2 px-4 py-2 rounded-xl transition-all text-xs uppercase tracking-widest font-bold bg-white/5 text-slate-400 hover:text-slate-100 border border-transparent hover:border-white/10">
                    <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                    <span id="settings-btn-text">Custom Setup</span>
                </button>
            </div>

            <div id="settings-panel" class="hidden overflow-hidden mb-12 bg-white/[0.02] border border-white/5 rounded-[32px] p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between mb-2">
                                <label id="label-inhale" class="text-[10px] font-black text-teal-400 uppercase tracking-widest">Inhale</label>
                            </div>
                            <input type="range" id="range-inhale" min="1" max="10" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-teal-500">
                        </div>
                        <div>
                            <div class="flex justify-between mb-2">
                                <label id="label-exhale" class="text-[10px] font-black text-teal-400 uppercase tracking-widest">Exhale</label>
                            </div>
                            <input type="range" id="range-exhale" min="1" max="10" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-teal-500">
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between mb-2">
                                <label id="label-pause" class="text-[10px] font-black text-teal-400 uppercase tracking-widest">Post-Exhale Pause</label>
                            </div>
                            <input type="range" id="range-pause" min="1" max="10" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-teal-500">
                        </div>
                        <div>
                            <div class="flex justify-between mb-2">
                                <label id="label-duration" class="text-[10px] font-black text-teal-400 uppercase tracking-widest">Session Duration</label>
                            </div>
                            <input type="range" id="range-duration" min="1" max="10" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-teal-500">
                        </div>
                    </div>
                </div>
                <div class="mt-8 pt-8 border-t border-white/5 flex justify-center">
                    <button id="reset-defaults" class="flex items-center space-x-2 text-slate-500 hover:text-slate-300 transition-colors text-[10px] font-bold uppercase tracking-widest">
                        <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                        <span id="reset-defaults-text">Reset to Protocol Defaults</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center max-w-2xl mx-auto w-full">
                <div class="text-center mb-12">
                    <h2 id="session-title" class="text-4xl font-light text-slate-100 mb-4 tracking-tight">Session Title</h2>
                    <div class="flex items-center justify-center space-x-6 text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em]">
                        <span class="flex items-center">
                            <i data-lucide="clock" class="w-3.5 h-3.5 mr-2 text-teal-400"></i>
                            <span id="session-timer" class="timer-val">5:00</span>
                        </span>
                        <span class="flex items-center">
                            <i data-lucide="activity" class="w-3.5 h-3.5 mr-2 text-teal-400"></i>
                            <span id="session-intensity">Moderate</span>
                        </span>
                    </div>
                </div>

                <!-- Pacer -->
                <div class="flex flex-col items-center justify-center space-y-12 h-80">
                    <div class="relative flex items-center justify-center w-[320px] h-[320px]">
                        <!-- Clock SVG -->
                        <svg id="pacer-clock" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100">
                           <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />
                           <path id="arc-inhale" d="" fill="none" stroke="rgba(20,184,166,0.3)" stroke-width="2" />
                           <path id="arc-exhale" d="" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="2" />
                           <path id="arc-pause" d="" fill="none" stroke="rgba(239, 68, 68, 0.2)" stroke-width="2" />
                           <g id="pacer-orbit-group" style="transform-origin: 50% 50%; transition: transform 1.05s linear;">
                             <!-- Invisible spacer to center the group origin -->
                             <circle cx="50" cy="50" r="48" fill="transparent"></circle>
                             <circle id="pacer-dot" cx="50" cy="2" r="3" fill="white" style="filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));" />
                             <circle id="pacer-dot-pulse" cx="50" cy="2" r="5" fill="rgba(255,255,255,0.2)" class="animate-pulse" />
                           </g>
                        </svg>

                        <div class="absolute inset-4 border-[1px] border-white/5 rounded-full"></div>
                        <div id="pacer-ring" class="absolute inset-10 border-[1px] border-white/10 rounded-full opacity-50 transition-all duration-1000"></div>
                        
                        <div id="pacer-core" class="w-48 h-48 rounded-full bg-gradient-to-b from-teal-500/10 to-transparent flex flex-col items-center justify-center backdrop-blur-xl border border-teal-500/20 shadow-[0_0_80px_rgba(20,184,166,0.15)] z-10 transition-all duration-1000">
                            <span id="pacer-phase-label" class="text-[10px] uppercase tracking-[0.3em] text-teal-400 font-bold mb-1 opacity-80">Expansion</span>
                            <span id="pacer-count" class="text-7xl font-thin tracking-tighter text-white timer-val">0</span>
                            <span id="pacer-unit" class="text-[10px] uppercase tracking-widest text-slate-500 mt-1">SECONDS</span>
                        </div>

                        <div class="absolute top-0 flex flex-col items-center">
                            <div id="inhale-indicator" class="w-px h-6 bg-gradient-to-b from-teal-400 to-transparent transition-all duration-500 opacity-20"></div>
                            <span id="inhale-text" class="text-[8px] uppercase tracking-[0.3em] font-bold mt-2 text-slate-600 transition-colors duration-500">Inhale</span>
                        </div>
                        <div class="absolute bottom-0 flex flex-col items-center">
                            <span id="exhale-text" class="text-[8px] uppercase tracking-[0.3em] font-bold mb-2 text-slate-600 transition-colors duration-500">Exhale</span>
                            <div id="exhale-indicator" class="w-px h-6 bg-gradient-to-t from-white/20 to-transparent transition-all duration-500 opacity-20"></div>
                        </div>
                    </div>
                    <div class="text-center">
                        <h3 id="pacer-status" class="text-2xl font-light tracking-[0.2em] text-slate-300 uppercase">Ready</h3>
                    </div>
                </div>

                <div class="mt-16 flex flex-col items-center space-y-6">
                    <button id="session-start" class="px-14 py-4 rounded-full text-sm font-black uppercase tracking-[0.3em] transition-all duration-500 transform active:scale-95 bg-teal-500 text-[#05070a] hover:bg-teal-400 shadow-[0_0_40px_rgba(20,184,166,0.3)]">
                        Commence
                    </button>
                    <p id="cycles-label" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                        Cycles Completed: <span id="cycles-count" class="text-teal-400">0</span>
                    </p>
                    <button id="session-restart" class="flex items-center space-x-2 text-slate-500 hover:text-slate-300 transition-colors text-[10px] font-bold uppercase tracking-widest pt-2">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                        <span id="restart-text">Restart Session</span>
                    </button>
                </div>

                <div class="mt-16 p-8 bg-white/[0.03] rounded-[32px] border border-white/5 max-w-lg w-full">
                    <h4 id="guide-label" class="font-bold text-teal-400 mb-3 text-[10px] uppercase tracking-[0.3em]">Protocol Guide</h4>
                    <p id="guide-desc" class="text-slate-400 text-sm leading-relaxed font-light">
                        Protocol instructions here.
                    </p>
                </div>
            </div>
        </div>
    </template>

    <script>

        function exitSession() {
            clearInterval(state.sessionTimer.interval);
            state.sessionTimer.isRunning = false;
            state.sessionTimer.cycles = 0;
        }

        function toggleSession(t) {
            if (state.sessionTimer.isRunning) {
                clearInterval(state.sessionTimer.interval);
                state.sessionTimer.isRunning = false;
            } else {
                if (state.sessionTimer.seconds <= 0) {
                    state.sessionTimer.seconds = state.activeSession.durationMinutes * 60;
                    state.sessionTimer.cycles = 0;
                }
                state.sessionTimer.isRunning = true;
                state.sessionTimer.phaseTime = state.activeSession.pattern.inhale;
                state.sessionTimer.interval = setInterval(() => tickSession(t), 1000);
            }
            render();
        }

        function tickSession(t) {
            state.sessionTimer.seconds--;
            state.sessionTimer.phaseTime--;

            if (state.sessionTimer.seconds <= 0) {
                clearInterval(state.sessionTimer.interval);
                state.sessionTimer.isRunning = false;
                render();
                return;
            }

            if (state.sessionTimer.phaseTime <= 0) {
                transitionPhase(t);
            }

            updatePacerUI(t);
            updateClockUI();
            document.getElementById('session-timer').textContent = formatTime(state.sessionTimer.seconds);
        }

        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            var angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        function describeArc(x, y, radius, startAngle, endAngle) {
            const end = endAngle >= 360 ? 359.99 : endAngle;
            const start = polarToCartesian(x, y, radius, startAngle);
            const endP = polarToCartesian(x, y, radius, end);
            const largeArcFlag = end - startAngle <= 180 ? "0" : "1";
            const d = ["M", start.x, start.y, "A", radius, radius, 0, largeArcFlag, 1, endP.x, endP.y].join(" ");
            return d;
        }

        function updateClockUI() {
            const s = state.activeSession;
            const p = s.pattern;
            const h = p.pauseAfterInhale || 0;
            const pa = p.pauseAfterExhale || 0;
            const total = p.inhale + h + p.exhale + pa || 1;
            
            const inhaleAngle = (p.inhale / total) * 360;
            const holdAngle = (h / total) * 360;
            const exhaleAngle = (p.exhale / total) * 360;
            
            document.getElementById('arc-inhale').setAttribute('d', describeArc(50, 50, 48, 0, inhaleAngle));
            document.getElementById('arc-exhale').setAttribute('d', describeArc(50, 50, 48, inhaleAngle + holdAngle, inhaleAngle + holdAngle + exhaleAngle));
            document.getElementById('arc-pause').setAttribute('d', describeArc(50, 50, 48, inhaleAngle + holdAngle + exhaleAngle, 360));

            // Needle rotation
            let elapsed = 0;
            const phaseTime = state.sessionTimer.phaseTime;
            const phase = state.sessionTimer.phase;
            
            if (phase === 'Inhale') {
                elapsed = p.inhale - phaseTime;
            } else if (phase === 'Hold (Full)') {
                elapsed = p.inhale + (h - phaseTime);
            } else if (phase === 'Exhale') {
                elapsed = p.inhale + h + (p.exhale - phaseTime);
            } else if (phase === 'Pause (Empty)') {
                elapsed = p.inhale + h + p.exhale + (pa - phaseTime);
            }
            
            const rotation = (elapsed / total) * 360;
            document.getElementById('pacer-orbit-group').style.transform = `rotate(${rotation}deg)`;
        }

        function transitionPhase(t) {
            const pattern = state.activeSession.pattern;
            const phases = ['Inhale', 'Exhale', 'Pause (Empty)'];
            let currentIdx = phases.indexOf(state.sessionTimer.phase);
            
            if (state.sessionTimer.phase === 'Inhale') {
                state.sessionTimer.phase = 'Exhale';
                state.sessionTimer.phaseTime = pattern.exhale;
            } else if (state.sessionTimer.phase === 'Exhale') {
                if (pattern.pauseAfterExhale > 0) {
                    state.sessionTimer.phase = 'Pause (Empty)';
                    state.sessionTimer.phaseTime = pattern.pauseAfterExhale;
                } else {
                    state.sessionTimer.phase = 'Inhale';
                    state.sessionTimer.phaseTime = pattern.inhale;
                    state.sessionTimer.cycles++;
                }
            } else {
                state.sessionTimer.phase = 'Inhale';
                state.sessionTimer.phaseTime = pattern.inhale;
                state.sessionTimer.cycles++;
            }
            
            document.getElementById('cycles-count').textContent = state.sessionTimer.cycles;
        }

        function updatePacerUI(t) {
            const core = document.getElementById('pacer-core');
            const count = document.getElementById('pacer-count');
            const status = document.getElementById('pacer-status');
            const phaseLabel = document.getElementById('pacer-phase-label');
            const inhaleInd = document.getElementById('inhale-indicator');
            const exhaleInd = document.getElementById('exhale-indicator');
            const ring = document.getElementById('pacer-ring');

            count.textContent = state.sessionTimer.phaseTime;
            
            const phaseMap = {
                'Inhale': { label: t.pacerPhases.expansion, status: t.pacerPhases.inhale, scale: 1.2, opacity: 1 },
                'Exhale': { label: t.pacerPhases.reduction, status: t.pacerPhases.exhale, scale: 0.8, opacity: 0.6 },
                'Pause (Empty)': { label: t.pacerPhases.reduction, status: t.cp, scale: 0.7, opacity: 0.4 }
            };

            const ui = phaseMap[state.sessionTimer.phase];
            phaseLabel.textContent = ui.label;
            status.textContent = ui.status;
            core.style.transform = `scale(${ui.scale})`;
            core.style.opacity = ui.opacity;
            
            inhaleInd.style.opacity = state.sessionTimer.phase === 'Inhale' ? '1' : '0.2';
            inhaleInd.style.height = state.sessionTimer.phase === 'Inhale' ? '4.75rem' : '2.375rem';
            document.getElementById('inhale-text').className = `text-[8px] uppercase tracking-[0.3em] font-bold mt-2 transition-colors duration-500 ${state.sessionTimer.phase === 'Inhale' ? 'text-teal-400' : 'text-slate-600'}`;

            exhaleInd.style.opacity = state.sessionTimer.phase === 'Exhale' ? '1' : '0.2';
            exhaleInd.style.height = state.sessionTimer.phase === 'Exhale' ? '4.75rem' : '2.375rem';
            document.getElementById('exhale-text').className = `text-[8px] uppercase tracking-[0.3em] font-bold mb-2 transition-colors duration-500 ${state.sessionTimer.phase === 'Exhale' ? 'text-teal-400' : 'text-slate-600'}`;
            
            if (ring) {
                ring.style.opacity = state.sessionTimer.isRunning ? '1' : '0.5';
                ring.style.transform = `scale(${state.sessionTimer.isRunning ? 1.05 : 1})`;
            }
        }

        // --- Global Events ---
        document.getElementById('toggle-lang').onclick = () => {
            state.lang = state.lang === 'en' ? 'zh' : 'en';
            saveState();
            render();
        };

        document.getElementById('measure-cp-btn').onclick = () => {
            state.activeView = 'cp-test';
            render();
        };

        // Initialize
        render();
    </script>
</body>
</html>
